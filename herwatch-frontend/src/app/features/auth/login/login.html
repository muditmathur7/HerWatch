<div class="auth-container">

    <div class="auth-card">

        <img src="assets/images/LOGO.png"
             alt="Logo"
             class="auth-logo">

        <h1>Welcome Back</h1>

        <p>Login to continue using HERWATCH</p>

        <form (ngSubmit)="onLogin()">

            <div class="input-group">
                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    [(ngModel)]="email" 
                    name="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    [(ngModel)]="password" 
                    name="password"
                    placeholder="Password"
                    required>
            </div>

            <button class="auth-btn" type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>

        </form>
        <p *ngIf="error" style="color:#ff6b6b; margin-top:10px; font-weight: 500;">{{ error }}</p>

        <div class="auth-footer">

            <p>
                Don't have an account?

                <a routerLink="/signup-step1">
                    Sign Up
                </a>

            </p>

        </div>

    </div>

</div>
