<div class="auth-container">

    <div class="auth-card">

        <img src="assets/images/LOGO.png"
             alt="Logo"
             class="auth-logo">

        <h1>Welcome Back</h1>

        <p>Login to continue using HERWATCH</p>

        <form (ngSubmit)="onLogin()">

            <div class="input-group">
                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    [(ngModel)]="email" 
                    name="email"
                    placeholder="Email Address">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    [(ngModel)]="password" 
                    name="password"
                    placeholder="Password">
            </div>

            <button class="auth-btn">
                Login
            </button>

        </form>
         <p *ngIf="error" style="color:#fff;margin-top:10px;">{{ error }}</p>

        <div class="auth-footer">

            <p>
                Don't have an account?

                <a routerLink="/signup-step1">
                    Sign Up
                </a>

            </p>

        </div>

    </div>

</div>
