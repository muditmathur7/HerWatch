<div class="dashboard-container">

    <app-sidebar></app-sidebar>

    <main class="dashboard-main">

        <div class="profile-card">

            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>

            <h1 *ngIf="!editMode">{{ profile.name }}</h1>
            <div class="input-group" *ngIf="editMode" style="margin-bottom:20px;">
                <i class="fas fa-user"></i>
                <input type="text" [(ngModel)]="profile.name" name="name" placeholder="Full Name">
            </div>

            <div class="profile-details" *ngIf="!editMode">
                <div class="detail-row"><strong>Username:</strong> <span>{{ profile.username }}</span></div>
                <div class="detail-row"><strong>Email:</strong> <span>{{ profile.email }}</span></div>
                <div class="detail-row"><strong>Phone:</strong> <span>{{ profile.phone }}</span></div>
                <div class="detail-row"><strong>Age:</strong> <span>{{ profile.age }}</span></div>
                <div class="detail-row"><strong>Gender:</strong> <span>{{ profile.gender }}</span></div>
            </div>

            <div *ngIf="editMode">

                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" [(ngModel)]="profile.phone" name="phone" placeholder="Phone Number">
                </div>

                <div class="input-group">
                    <i class="fas fa-calendar"></i>
                    <input type="number" [(ngModel)]="profile.age" name="age" placeholder="Age">
                </div>

                <div class="input-group">
                    <i class="fas fa-venus"></i>
                    <select [(ngModel)]="profile.gender" name="gender">
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>

            <button class="auth-btn" *ngIf="!editMode" (click)="editMode = true">Edit Profile</button>

            <div *ngIf="editMode" style="display:flex; gap:15px; margin-top:10px;">
                <button class="auth-btn" (click)="saveProfile()">Save</button>
                <button class="auth-btn" (click)="cancelEdit()">Cancel</button>
            </div>

        </div>

    </main>

</div>
