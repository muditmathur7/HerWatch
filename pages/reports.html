<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | HERWATCH</title>

    <link rel="stylesheet" href="../css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="../assets/images/LOGO.png" alt="">
            <h2>HERWATCH</h2>
        </div>

        <ul>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="contacts.html"><i class="fas fa-users"></i> Contacts</a></li>
            <li><a href="reports.html" class="active"><i class="fas fa-flag"></i> Reports</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>

    </aside>

    <main class="dashboard-main">

        <div class="reports-container">

            <h1>Report an Incident</h1>

            <form id="reportForm">

                <div class="input-group">
                    <i class="fas fa-exclamation-circle"></i>

                    <select id="incidentType" required>
                        <option value="">Select Incident Type</option>
                        <option>Harassment</option>
                        <option>Stalking</option>
                        <option>Theft</option>
                        <option>Unsafe Area</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-map-marker-alt"></i>

                    <input type="text"
                           id="incidentLocation"
                           placeholder="Location"
                           required>
                </div>

                <div class="input-group">
                    <textarea id="incidentDescription"
                              placeholder="Describe the incident..."
                              rows="5"
                              required></textarea>
                </div>

                <button type="submit" class="auth-btn">
                    Submit Report
                </button>

            </form>

            <div id="reportsList"></div>

        </div>

    </main>

</div>

<script src="../js/common.js"></script>

</body>
</html>
