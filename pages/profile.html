<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | HERWATCH</title>

    <link rel="stylesheet" href="../css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="../assets/images/LOGO.png" alt="">
            <h2>HERWATCH</h2>
        </div>

        <ul>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="contacts.html"><i class="fas fa-users"></i> Contacts</a></li>
            <li><a href="reports.html"><i class="fas fa-flag"></i> Reports</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>

    </aside>

    <main class="dashboard-main">

        <div class="profile-card">

            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>

            <h1 id="profileName">User Name</h1>

            <div class="profile-details">

                <div class="detail-row">
                    <strong>Username:</strong>
                    <span id="profileUsername"></span>
                </div>

                <div class="detail-row">
                    <strong>Email:</strong>
                    <span id="profileEmail"></span>
                </div>

                <div class="detail-row">
                    <strong>Phone:</strong>
                    <span id="profilePhone"></span>
                </div>

                <div class="detail-row">
                    <strong>Age:</strong>
                    <span id="profileAge"></span>
                </div>

                <div class="detail-row">
                    <strong>Gender:</strong>
                    <span id="profileGender"></span>
                </div>

            </div>

            <button class="auth-btn">
                Edit Profile
            </button>

        </div>

    </main>

</div>

<script src="../js/profile.js"></script>

</body>
</html>
